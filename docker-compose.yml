# The on-prem bundle.
#
#     cd deploy/onprem
#     cp .env.example .env      # fill it in — see the README
#     docker compose up -d --build
#
# Six containers, one image (built once, run five times) plus Mongo.
#
# ## The network shape, which is the security design
#
# Two networks. `internal` carries everything and is marked `internal: true`, so
# Docker installs no gateway route on it — a container attached only to that
# network **cannot reach the internet at all**, regardless of what its code
# tries. Mongo, the console apps and the admin live there.
#
# Exactly one container is also on `egress`: the gateway. It is the only process
# in the bundle with a route out, which means the anonymizer is not a
# convention that call sites are asked to honour — it is the only door. If a
# future code path in the console forgets to use it and calls a vendor directly,
# that call does not leak; it fails to connect.
#
# `metrics` is on `egress` too, because it pushes the rollup up. What it may
# send is constrained by `apps/metrics/src/guard.ts`, which refuses to transmit
# anything that is not a count, a code, a hash or a timestamp.

name: payroll-onprem

x-image: &image
  # Pulled, not built. The published image is the artefact you are running; there
  # is no source tree on this machine and there does not need to be.
  image: ${PAYROLL_IMAGE:-dekelmichpalil.azurecr.io/payroll-onprem}:${BUNDLE_VERSION:-stable}
  pull_policy: missing
  restart: unless-stopped
  env_file: .env

# Shared by the three Next apps: the database, and — the important part — the
# gateway as the only model endpoint they know about.
x-app-env: &app-env
  DEPLOY_TARGET: ${DEPLOY_TARGET:-onprem}
  # These containers are on `internal` only and cannot reach Better Stack, so
  # their own logs and spans go out through the gateway — the same door, and the
  # same token, as every model call. The alternative was attaching them to
  # `egress`, which trades the containment guarantee for a log line.
  TELEMETRY_FORWARD_URL: http://gateway:8090
  TELEMETRY_FORWARD_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  MONGODB_URI: mongodb://mongo:27017
  MONGODB_DB: ${MONGODB_DB:-payroll}
  # These two names are the ones the Anthropic SDK and every call site in the
  # repo already read (packages/core/src/model-endpoints.ts). Pointing them here
  # is what puts the pseudonymizer in front of every model call.
  ANTHROPIC_BASE_URL: http://gateway:8090
  INTERFAZE_BASE_URL: http://gateway:8090/v1
  # The apps authenticate to the gateway, not to the vendor. They hold no
  # vendor key at all — the gateway substitutes its own, so a compromised
  # console cannot spend the model budget or bypass the audit.
  ANTHROPIC_API_KEY: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  INTERFAZE_API_KEY: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  # Prompt-by-reference (`@payroll/core/complete`). The app sends a prompt ID
  # and variables to the SAME door: the gateway pseudonymizes them and forwards
  # to the broker, which holds the prompt itself. The app has neither the prompt
  # nor a credential for the broker — only the gateway token it already had.
  MODEL_BROKER_URL: http://gateway:8090
  MODEL_BROKER_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  # Outbound mail, by the same argument and through the same door. These apps
  # hold no Resend key — deliberately, because a credential that can send mail
  # as the bureau does not belong in a `.env` on a payroll server — so a reply
  # is described to the gateway and sent by us under the bureau's own verified
  # domain. `packages/core/src/mail-transport.ts` makes the choice once, from
  # DEPLOY_TARGET, so no call site knows which deployment it is running in.
  # Named for the door, not for the destination: an app reaches the gateway, and
  # the gateway's own MAIL_RELAY_URL is the second hop to our control plane.
  MAIL_GATEWAY_URL: http://gateway:8090
  MAIL_GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  # The ת"ז keyring. Every app that reads or writes an employee needs it —
  # `packages/core/src/national-id.ts` throws on the first identity it touches
  # without it, which in practice is the first page that lists an employee. It
  # belongs to every app service here: the bundle previously
  # asked for a `NATIONAL_ID_PEPPER` that nothing in the tree reads any more,
  # so an install could satisfy every required variable and still fail.
  NATIONAL_ID_KEYS: ${NATIONAL_ID_KEYS:?set NATIONAL_ID_KEYS in .env}
  NATIONAL_ID_ACTIVE_KEY: ${NATIONAL_ID_ACTIVE_KEY:-}

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    networks: [internal]
    volumes:
      - mongo-data:/data/db
      # A backup target the bureau's own regime can pick up, per
      # docs/on-prem-architecture.md §6.6.
      - ${BACKUP_DIR:-./backups}:/backups
    command: ["--bind_ip_all"]
    healthcheck:
      # `mongosh --eval` rather than a port check: an accepting socket is not a
      # ready database, and the apps' first query happens on the first request.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # ── The only container with a route to the internet ────────────────────────
  gateway:
    <<: *image
    environment:
      # Prompts and vendor keys live in our cloud; this is the hop to them.
      # Only the gateway holds these — no app container can reach the broker.
      MODEL_BROKER_URL: ${MODEL_BROKER_URL:-}
      MODEL_BROKER_TOKEN: ${MODEL_BROKER_TOKEN:-}
      SERVICE: gateway
      DEPLOY_TARGET: ${DEPLOY_TARGET:-onprem}
      GATEWAY_PORT: "8090"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-payroll}
      # The real vendor keys live here and nowhere else in the bundle.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      INTERFAZE_API_KEY: ${INTERFAZE_API_KEY:-}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      GATEWAY_MODE: ${GATEWAY_MODE:-enforce}
      GATEWAY_KINDS: ${GATEWAY_KINDS:-email,id,phone,person,org}
      GATEWAY_ATTACHMENTS: ${GATEWAY_ATTACHMENTS:-block}
      # ── Mail ────────────────────────────────────────────────────────────
      # The install has no inbound path at any perimeter — that is the thing we
      # sell — so mail cannot be pushed to it. The gateway long-polls the
      # control plane for deliveries parked there, opens each with the private
      # key below, and hands it to the console over `internal`. It carries this
      # job because it is the only container with a route out; putting the
      # poller anywhere else would mean a second container on `egress`.
      MAIL_INBOUND_MODE: ${MAIL_INBOUND_MODE:-off}
      # Both default to the metrics container's values: one identity per
      # install, not two that can be set inconsistently.
      MAIL_RELAY_URL: ${MAIL_RELAY_URL:-${METRICS_CONTROL_PLANE_URL:-}}
      MAIL_INSTALL_ID: ${MAIL_INSTALL_ID:-${METRICS_INSTALL_ID:-}}
      MAIL_INSTALL_TOKEN: ${MAIL_INSTALL_TOKEN:-${METRICS_INSTALL_TOKEN:-}}
      # The half of the pair we never hold. Generated by
      # `node deploy/onprem/generate-mail-key.mjs`; the gateway publishes the
      # public half itself at boot, so at no point do both halves exist in one
      # place. An install that loses this cannot read its parked mail and
      # cannot be helped to.
      MAIL_INSTALL_PRIVATE_KEY: ${MAIL_INSTALL_PRIVATE_KEY:-}
      MAIL_RELAY_POLL_WAIT_SEC: ${MAIL_RELAY_POLL_WAIT_SEC:-25}
      # Where a collected delivery is handed in. The console runs the same
      # `handleInboundEmail` the hosted webhook does, so a month opened on a
      # bureau's own hardware is the same month.
      MAIL_DELIVER_URL: http://console:3201
      MAIL_DELIVER_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal, egress]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8090/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s

  metrics:
    <<: *image
    environment:
      SERVICE: metrics
      DEPLOY_TARGET: ${DEPLOY_TARGET:-onprem}
      METRICS_PORT: "8091"
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: ${MONGODB_DB:-payroll}
      METRICS_INSTALL_ID: ${METRICS_INSTALL_ID:?set METRICS_INSTALL_ID in .env}
      # Which copy of this install, and where it answers. Both reach the
      # container through `env_file` anyway; they are named here because a
      # telemetry row that cannot say which box and which environment it came
      # from is a row nobody can act on, and that should not depend on an
      # inherited variable somebody could remove without noticing.
      METRICS_ENVIRONMENT: ${METRICS_ENVIRONMENT:-production}
      METRICS_SITE_ADDRESS: ${METRICS_SITE_ADDRESS:-${SITE_ADDRESS:-}}
      METRICS_CONTROL_PLANE_URL: ${METRICS_CONTROL_PLANE_URL:-}
      METRICS_INSTALL_TOKEN: ${METRICS_INSTALL_TOKEN:-}
      METRICS_HASH_SALT: ${METRICS_HASH_SALT:-}
      # The fleet dashboard. Same rollup, same guard, one Better Stack source
      # shared with the hosted deployment — `deployTarget` is what tells the two
      # apart, which is what makes a cloud-vs-on-prem comparison a GROUP BY
      # rather than a join across two datasets.
      BETTERSTACK_INGEST_HOST: ${BETTERSTACK_INGEST_HOST:-}
      BETTERSTACK_SOURCE_TOKEN: ${BETTERSTACK_SOURCE_TOKEN:-}
      BETTERSTACK_HEARTBEAT_URL: ${BETTERSTACK_HEARTBEAT_URL:-}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal, egress]
    depends_on:
      mongo: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ── The UI. No route to the internet; model calls go via the gateway ───────
  # One console, serving on 3201. It kept the service name `console` through the
  # v1 retirement so CONSOLE_URL and every depends_on below still resolve; only
  # the port moved, because the app behind it is the one that used to be v2.
  console:
    <<: *image
    environment:
      <<: *app-env
      # The container is `console`; the APP is console-v2, and the cloud half of
      # it reports under that name. One app, one service, or every chart that
      # compares cloud with on-prem is comparing two names for one thing.
      TELEMETRY_SERVICE: console-v2
      SERVICE: console
      ADMIN_URL: http://admin:3300
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      # The payroll connector — OUR infrastructure, not the customer's, and
      # therefore not in this bundle. It drives a Windows desktop over RDP on a
      # VM we run, and the console reaches it the same way the hosted deployment
      # does: by URL and bearer, over HTTPS. Blank unless this install uses one.
      #
      # `resolveWorker()` fails CLOSED (PAY-66): an agency with no row in
      # `console_michpal_workers` is refused rather than falling back here, and
      # only the ids in MICHPAL_SHARED_WORKER_AGENCY_IDS may use this shared
      # entry.
      MICHPAL_WORKER_URL: ${MICHPAL_WORKER_URL:-}
      MICHPAL_WORKER_TOKEN: ${WORKER_TOKEN:-}
      MICHPAL_SHARED_WORKER_AGENCY_IDS: ${MICHPAL_SHARED_WORKER_AGENCY_IDS:-}
      # Onboarding documents, chat uploads and the run/audit trail. On-prem
      # `storage.ts` writes these to disk whatever else is configured, and
      # without this they land inside the container — gone on the next `up
      # --build`, and unwritable anyway because the app does not own /app.
      CONSOLE_DATA_DIR: /var/lib/payroll/console
    volumes:
      - console-files:/var/lib/payroll/console
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3201/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s

  admin:
    <<: *image
    environment:
      <<: *app-env
      TELEMETRY_SERVICE: admin
      SERVICE: admin
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3300/api/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s
  agent:
    <<: *image
    environment:
      <<: *app-env
      TELEMETRY_SERVICE: agent
      SERVICE: agent
      AGENT_PORT: "8080"
      AGENT_WEBHOOK_TOKEN: ${INTERNAL_TOKEN:?set INTERNAL_TOKEN in .env}
      PAYROLL_ADMIN_URL: http://admin:3300
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal]
    depends_on:
      mongo: {condition: service_healthy}
      gateway: {condition: service_started}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── The on-prem cron ──────────────────────────────────────────────────────
  #
  # Nothing periodic in the product runs itself: each job is a route something
  # has to call, and in the hosted deployment that something is Vercel Cron,
  # which does not exist here. Without this container every screen works, every
  # health check is green, and the monitor and the policy check silently never
  # run.
  scheduler:
    <<: *image
    environment:
      SERVICE: scheduler
      TELEMETRY_SERVICE: scheduler
      DEPLOY_TARGET: ${DEPLOY_TARGET:-onprem}
      SCHEDULER_PORT: "8092"
      # The scheduled routes check `Authorization: Bearer $CRON_SECRET`.
      CRON_SECRET: ${CRON_SECRET:?set CRON_SECRET in .env}
      CONSOLE_URL: http://console:3201
      ADMIN_INTERNAL_URL: http://admin:3300
      SCHEDULER_JOBS: ${SCHEDULER_JOBS:-}
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    networks: [internal]
    depends_on:
      admin: {condition: service_started}
      console: {condition: service_started}
    healthcheck:
      # Returns 503 when a job has stopped succeeding, so a queue that stopped
      # draining is visible from `docker compose ps` rather than from an
      # employee eventually mentioning that no reminder arrived.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8092/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 90s
  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
      CONSOLE_PORT: ${CONSOLE_PORT:-443}
      ADMIN_PORT: ${ADMIN_PORT:-4301}
    ports:
      - "${CONSOLE_PORT:-443}:${CONSOLE_PORT:-443}"
      # The admin app is OUR backoffice, not part of what a bureau buys: it
      # shows commercial fields (pricing bands, ARR), AI spend and internal
      # controls, and its API routes are all `requireAdmin`. So the port is
      # bound to LOOPBACK by default — the container is running and every
      # service that talks to it over the `internal` network is unaffected,
      # but no browser on the bureau's LAN can reach it.
      #
      # We reach it with a tunnel:  ssh -L 4301:127.0.0.1:4301 <host>
      # then https://localhost:4301 (Caddy answers with its internal cert).
      #
      # `ADMIN_BIND=0.0.0.0` publishes it normally. That is for boxes that are
      # ours — cloud.dekel.io, the demo VM — never for a customer install.
      - "${ADMIN_BIND:-127.0.0.1}:${ADMIN_PORT:-4301}:${ADMIN_PORT:-4301}"
      # ACME's HTTP-01 challenge, and nothing else. A LAN install never performs
      # one, so it sets ACME_PORT=0 and Docker picks an unused port — claiming
      # :80 on a server that already runs something there fails an install that
      # was otherwise fine.
      - "${ACME_PORT:-80}:80"
    volumes:
      - ./${CADDYFILE:-Caddyfile.lan}:/etc/caddy/Caddyfile:ro
      # The issued certificate, and for the LAN mode the CA itself. Losing this
      # volume means every browser has to trust a new CA.
      - caddy-data:/data
    networks: [internal, egress]
    depends_on:
      console: {condition: service_started}
      admin: {condition: service_started}

  # ── Unattended updates ─────────────────────────────────────────────────────
  #
  # Polls the registry every ten minutes and restarts a service when its image
  # has moved. Three things about how it is configured are decisions rather than
  # defaults:
  #
  # **It watches a channel, not a version.** A digest only changes for a tag we
  # re-push, so `BUNDLE_VERSION=1.0.0` would never update — an immutable version
  # and an automatic update are opposite requests. `stable` is the tag we move
  # when a release is blessed, which keeps the customer on something we chose
  # rather than on whatever built last.
  #
  # **It only touches what is labelled.** `--label-enable` means Mongo is never
  # restarted by a robot: a database upgrade is a data migration, and one that
  # happens at 03:00 because an image moved is the failure this whole bundle is
  # arranged to avoid. Caddy is a pinned upstream image and is left alone for
  # the same reason.
  #
  # **It has the Docker socket, and that is a real cost.** Anything holding this
  # socket can start a privileged container, so it is root on the host in
  # practice — on a machine holding payroll data that is worth saying out loud
  # rather than burying. It buys unattended security patching, which for a box
  # nobody logs into is usually the larger risk. A bureau that disagrees sets
  # `AUTO_UPDATE=monitor` (it reports and changes nothing) or stops the
  # container; `./install.sh update` then does the same job by hand.
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    # No --rolling-restart. It is fatal in combination with monitor-only —
    # "Rolling restarts is not compatible with the global monitor only flag" —
    # so the documented way to opt out of unattended updates would have put the
    # updater into a crash loop. It bought little anyway: all seven containers
    # run the SAME image, so they restart within a few seconds of each other
    # whichever order they go in.
    command: --interval ${AUTO_UPDATE_INTERVAL:-600} --label-enable --cleanup
    environment:
      # `monitor` reports what it would have done and does nothing.
      WATCHTOWER_MONITOR_ONLY: ${AUTO_UPDATE_MONITOR_ONLY:-false}
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_TIMEOUT: 60s
      # Watchtower 1.7.1 negotiates Docker API 1.25 by default, and any daemon
      # from Engine 25 on refuses it outright — "client version 1.25 is too old".
      # It then logs that error every poll for ever, which reads as an updater
      # that is running and is in fact doing nothing at all. 1.41 is old enough
      # for every Engine version this bundle supports.
      DOCKER_API_VERSION: ${DOCKER_API_VERSION:-1.41}
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # `egress` to reach the registry. NOT `internal` — it has no business
    # talking to the applications or the database, and giving it a route it does
    # not need to a process that already holds the Docker socket would be
    # careless.
    networks: [egress]

networks:
  # No gateway route is installed on this network. A container attached only to
  # it cannot reach the internet even if its code tries to — which is what makes
  # the gateway the only door rather than the recommended one.
  internal:
    internal: true
  egress:

volumes:
  caddy-data:
  mongo-data:
  console-files:
